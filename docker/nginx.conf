server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Flutter web is a single-page app: every route must fall through to
    # index.html or a deep link (e.g. /cases/<id>) 404s on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # users keep running the previous release after a deploy.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 12m;
}
