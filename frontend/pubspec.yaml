name: libra_law
description: Libra Law Practice Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  provider: ^6.1.1
  go_router: ^13.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  xml: ^6.3.0
  webview_flutter: ^4.4.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  url_launcher: ^6.2.4
  image_picker: ^1.0.7
  file_picker: ^10.1.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  flutter_webrtc: ^1.6.0
  web_socket_channel: ^3.0.1
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  web: ^1.1.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/app logo.png
    - assets/imagies1/wrting case image.webp
    - assets/imagies1/add cilent images.png
    - assets/imagies1/bills for cilent.webp
    - assets/imagies1/chat for cilent.jpg
    - assets/imagies1/cilent case.jpg
    - assets/imagies1/document for cilent page.jpg
    - assets/imagies1/hearning data.webp
    - assets/imagies1/add cilent lawyer.jpg
    - assets/imagies1/case page lawyer.jpg
    - assets/imagies1/cilent for lawyer.jpg