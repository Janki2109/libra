org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# The project lives on a different drive letter (D:) than the pub cache
# (C:\Users\<user>\AppData\Local\Pub\Cache) that plugin sources like
# flutter_webrtc/share_plus/file_picker are compiled from. Kotlin's
# incremental-compilation cache stores paths relative to the project root, and
# Windows can't express a relative path across drive letters — every release
# build failed with "this and base files have different roots" even against a
# completely fresh cache. Incremental compilation just falls back to a full
# recompile each time instead; slower, but it doesn't try to persist a
# relative path that can't exist.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
